# ============================================
# WORKFLOW 4: Secrets & Environments
# Shows how to use secrets and environment gates
# ============================================

name: 04 - Secrets and Environments

on:
  push:
    branches: [main]

jobs:

  # ---- JOB 1: Test (uses repo-level secrets) ----
  test:
    name: Test with Secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci

      # Use a secret in an env variable
      # NEVER put secrets directly in run: commands
      - name: Run tests with database config
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}   # ← safe way to use secrets
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Running tests..."
          echo "DB configured: ${{ secrets.DATABASE_URL != '' }}"
          # Note: the actual secret value is masked in logs
          npm test

  # ---- JOB 2: Deploy to Staging ----
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    environment: staging    # ← uses staging environment & its secrets

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}  # uses staging's DB_URL
        run: |
          echo "🚀 Deploying to STAGING environment"
          echo "Environment: staging"
          echo "Triggered by: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"
          # In a real workflow, this would run your deploy script
          echo "✅ Staging deployment complete!"

  # ---- JOB 3: Deploy to Production (requires approval!) ----
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production   # ← requires reviewer approval before running!

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}  # uses production's DB_URL
        run: |
          echo "🚀 Deploying to PRODUCTION environment"
          echo "Commit SHA: ${{ github.sha }}"
          echo "✅ Production deployment complete!"