# ============================================
# WORKFLOW 2: Build & Artifacts
# Build the project and pass output between jobs
# ============================================

name: 02 - Build and Upload Artifact

on:
  push:
    branches: [main]

jobs:

  # ---- JOB 1: Run tests ----
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # ---- JOB 2: Build (only runs if test passes) ----
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test       # ← only runs if 'test' job succeeds

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci

      # Run the build script (copies src/ to dist/)
      - name: Build project
        run: npm run build

      # Save build output as an artifact
      # This uploads dist/ to GitHub's storage
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output          # artifact name
          path: dist/                 # what to upload
          retention-days: 7          # keep for 7 days

  # ---- JOB 3: Use the artifact (simulates deploy) ----
  use-artifact:
    name: Use Build Output
    runs-on: ubuntu-latest
    needs: build      # ← waits for build to finish

    steps:
      # Download the artifact onto this new machine
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: downloaded-dist/    # where to put it

      # Verify it arrived correctly
      - name: Verify artifact contents
        run: |
          echo "📦 Downloaded artifact contents:"
          ls -la downloaded-dist/
          echo "✅ Artifact successfully passed between jobs!"